name: Build mempodroid

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nkmrsh/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Compile mempodroid
        run: |
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi16-clang \
          -O2 -Wall mempodroid.c -o mempodroid -static

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: mempodroid-binary
          path: mempodroid
